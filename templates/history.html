{% extends "base.html" %}
{% block title %}Riwayat — wilkerstat checker{% endblock %}
{% block content %}
<h1>📋 Riwayat Upload</h1>

<div class="history-wrap">
    <table class="data-table" id="historyTable">
        <thead>
            <tr>
                <th>Waktu ({{ server_tz }})</th>
                <th>IP / Host</th>
                <th>File</th>
                <th>Jenis</th>
                <th>Record</th>
                <th>Baru</th>
                <th>Update</th>
                <th>Sama</th>
                <th>Status</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody id="historyBody">
            <tr><td colspan="10" class="loading-msg">Memuat...</td></tr>
        </tbody>
    </table>
</div>

<h2>📈 Tren Progres</h2>
<div id="trendChart" class="trend-chart-wrap">
    <canvas id="trendCanvas"></canvas>
</div>

<!-- Modal detail -->
<div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">✕</button>
        <h3 id="modalTitle">Detail Upload</h3>
        <div id="modalBody"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='history.js') }}"></script>
{% endblock %}
